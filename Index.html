<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyush Patanjali Swadeshi Kendra</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="logo" onclick="router('home')">
            <i class="fa-solid fa-leaf"></i> PP Swadeshi
        </div>
        <nav>
            <ul>
                <li onclick="router('home')"><i class="fa fa-home"></i> Home</li>
                <li onclick="router('cart')">
                    <i class="fa fa-shopping-cart"></i> Cart 
                    <span id="cart-count">0</span>
                </li>
                <li onclick="toggleAdminLogin()"><i class="fa fa-user-shield"></i> Admin</li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main id="app">
        
        <!-- VIEW: HOME (Product Listing) -->
        <section id="home-view" class="view active">
            <div class="hero">
                <h1>Swadeshi Samriddhi</h1>
                <p>Best Quality Patanjali Products at Wholesale Prices</p>
            </div>
            <div class="container">
                <h2>Featured Products</h2>
                <div class="product-grid" id="product-list">
                    <!-- Products injected via JS -->
                </div>
            </div>
        </section>

        <!-- VIEW: PRODUCT DETAILS -->
        <section id="product-view" class="view">
            <button class="back-btn" onclick="router('home')"><i class="fa fa-arrow-left"></i> Back</button>
            <div class="product-detail-container" id="product-detail-content">
                <!-- Details injected via JS -->
            </div>
        </section>

        <!-- VIEW: CART -->
        <section id="cart-view" class="view">
            <div class="container">
                <h2>Your Cart</h2>
                <div class="cart-layout">
                    <div class="cart-items" id="cart-items-container">
                        <!-- Cart items injected via JS -->
                    </div>
                    <div class="cart-summary">
                        <h3>Price Details</h3>
                        <div class="summary-row">
                            <span>Total Items</span>
                            <span id="total-items">0</span>
                        </div>
                        <div class="summary-row">
                            <span>Total Price</span>
                            <span id="total-price">₹0</span>
                        </div>
                        <button class="btn-primary" onclick="router('checkout')">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: CHECKOUT -->
        <section id="checkout-view" class="view">
            <div class="container">
                <h2>Checkout</h2>
                <form id="checkout-form" class="checkout-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea id="address" required placeholder="Delivery Address"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="payment">
                            <option value="COD">Cash on Delivery</option>
                            <option value="UPI">UPI / Wallet</option>
                        </select>
                    </div>
                    <div class="summary-row total-final">
                        <span>Total to Pay:</span>
                        <span id="final-pay-amount">₹0</span>
                    </div>
                    <button type="submit" class="btn-primary">Place Order</button>
                </form>
            </div>
        </section>

        <!-- VIEW: ORDER CONFIRMATION -->
        <section id="order-success-view" class="view">
            <div class="success-message">
                <i class="fa fa-check-circle"></i>
                <h2>Order Placed Successfully!</h2>
                <p>Thank
